name: Vercel Preview Deployment

# Vercel's GitHub integration already creates Preview deployments for pushes and PRs.
# Keep this Actions workflow manual-only to avoid duplicate deployments and API quota use.
# Use workflow_dispatch only as a deliberate fallback after verifying VERCEL_* secrets
# point to the current shunai394-9704s-projects team and ai-acquisition-search project.

concurrency:
  group: vercel-preview-manual
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_dispatch:

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Project Artifacts
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"
