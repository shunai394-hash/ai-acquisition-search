name: Claude Code Plugin Validation

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "commands/**"
      - "commands/**"
      - ".mcp.json"
      - "src/mcp/**"
      - "src/lib/video/**"
      - "src/lib/acquisition/**"
      - "src/app/api/analyze/**"
      - "package.json"
      - "package-lock.json"
      - "README-CLAUDE-CODE.md"
      - ".github/workflows/claude-plugin.yml"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - ".mcp.json"
      - "src/mcp/**"
      - "src/lib/video/**"
      - "package.json"
      - "package-lock.json"
      - "README-CLAUDE-CODE.md"
      - ".github/workflows/claude-plugin.yml"

  # validate changes to the plugin package

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate .
