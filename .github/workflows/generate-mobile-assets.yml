name: Generate mobile brand assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PNG assets from brand artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          out = Path("mobile/assets")
          out.mkdir(parents=True, exist_ok=True)

          def build(path):
              img = Image.new("RGB", (1024, 1024), (8, 8, 9))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle(
                  (210, 210, 814, 814),
                  radius=150,
                  outline=(255, 255, 255),
                  width=38,
              )
              points = [
                  (285, 600),
                  (410, 600),
                  (488, 415),
                  (599, 665),
                  (682, 600),
                  (754, 600),
              ]
              draw.line(points, fill=(255, 255, 255), width=46, joint="curve")
              r = 23
              for x, y in (points[0], points[-1]):
                  draw.ellipse((x-r, y-r, x+r, y+r), fill=(255, 255, 255))
              img.save(path, "PNG", optimize=True)

          build(out / "icon.png")
          build(out / "splash-icon.png")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/icon.png mobile/assets/splash-icon.png
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore: generate mobile brand png assets [skip ci]"
          git push
